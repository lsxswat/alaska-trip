function getImg(key){
var k=key.toLowerCase().replace(/[^a-z0-9]/g,'');
if(k.indexOf('airport')>=0||k.indexOf('anc')>=0)return IMG.airport;
if(k.indexOf('denali')>=0||k.indexOf('murie')>=0||k.indexOf('horseshoe')>=0||k.indexOf('healy')>=0||k.indexOf('savage')>=0||k.indexOf('tundra')>=0||k.indexOf('cantwell')>=0)return IMG.denali;
if(k.indexOf('matanuska')>=0)return IMG.matanuska;
if(k.indexOf('kenai')>=0||k.indexOf('cruise')>=0||k.indexOf('fjord')>=0)return IMG.kenai;
if(k.indexOf('santa')>=0||k.indexOf('claus')>=0)return IMG.santa;
if(k.indexOf('museum')>=0||k.indexOf('north')>=0)return IMG.museum;
if(k.indexOf('castner')>=0)return IMG.castner;
if(k.indexOf('solomon')>=0||k.indexOf('valdez')>=0)return IMG.valdez;
if(k.indexOf('keystone')>=0)return IMG.keystone;
if(k.indexOf('worthington')>=0)return IMG.worthington;
if(k.indexOf('thompson')>=0)return IMG.thompson;
if(k.indexOf('wildlife')>=0||k.indexOf('conservation')>=0||k.indexOf('awcc')>=0)return IMG.awcc;
if(k.indexOf('zoo')>=0)return IMG.zoo;
if(k.indexOf('byron')>=0)return IMG.byron;
if(k.indexOf('portage')>=0||(k.indexOf('lake')>=0&&!k.includes('horseshoe')))return IMG.portage;
if(k.indexOf('whittier')>=0||k.indexOf('tunnel')>=0)return IMG.whittier;
if(k.indexOf('seward')>=0||k.indexOf('bistro')>=0||k.indexOf('eats')>=0||k.indexOf('dining')>=0)return IMG.seward;
if(k.indexOf('bear')>=0||k.indexOf('kayak')>=0)return IMG.bear;
if(k.indexOf('harding')>=0||k.indexOf('icefield')>=0)return IMG.harding;
if(k.indexOf('fairbanks')>=0)return IMG.fairbanks;
if(k.indexOf('motel')>=0||k.indexOf('inn')>=0||k.indexOf('suites')>=0||k.indexOf('cabins')>=0||k.indexOf('western')>=0||k.indexOf('airbnb')>=0||k.indexOf('gables')>=0||k.indexOf('microtel')>=0)return IMG.hotel;
return IMG.seward;
}

function getDesc(title){return DESC[title]||'';}

// ═══════════════════════════════════════════════════════ MAP
initData();
allPoints=[];
DAYS.forEach(function(d){d.events.forEach(function(e){allPoints.push({type:e.type,title:e.title,desc:e.desc,lat:e.lat,lng:e.lng,day:d.day,date:d.date,dayTitle:d.title})})});

var streetLayer=L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:20,attribution:'&copy; OSM &copy; <a href="https://carto.com/">CARTO</a>'});
var satelliteLayer=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'&copy; Esri'});
var map=L.map('map',{center:[62.5,-149],zoom:7,zoomControl:true,attributionControl:true,layers:[streetLayer]});

document.querySelectorAll('.layer-btn').forEach(function(b){
b.addEventListener('click',function(){
document.querySelectorAll('.layer-btn').forEach(function(x){x.classList.remove('active')});
b.classList.add('active');
if(b.dataset.layer==='street'){map.removeLayer(satelliteLayer);map.addLayer(streetLayer)}
else{map.removeLayer(streetLayer);map.addLayer(satelliteLayer)}
})});

// ═══════════════════════════════════════════════════════ MARKERS
detailMarkers=[];
clusterMarkers=[];

function makePOIMarker(p,active,idx){
var c=COLORS[p.type]||'#2e7d32';
var iS=active?24:18,lS=active?13:11;
var R=idx%2===0;
var gap=18;
var lw=Math.min(p.title.length*8+6,200);
var tw=iS+gap+lw;
var h=iS+8;
var labelHtml='<div style="font-size:'+lS+'px;font-weight:400;color:#000;white-space:nowrap;pointer-events:none">'+esc(p.title)+'</div>';
var iconHtml='<div style="font-size:'+iS+'px;color:'+c+';line-height:1;pointer-events:auto">'+FAI[p.type]+'</div>';
var html='<div style="display:flex;align-items:center;gap:'+gap+'px;height:'+h+'px">'+(R?iconHtml+labelHtml:labelHtml+iconHtml)+'</div>';
var ax=R?(iS)/2:tw-(iS)/2;
return L.divIcon({className:'',html:html,iconSize:[tw,h],iconAnchor:[ax,h/2]});
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function buildDetail(){
var g=L.layerGroup();
allPoints.forEach(function(p,i){
var m=L.marker([p.lat,p.lng],{icon:makePOIMarker(p,false,i)}).addTo(g);
var imgs=getImg(p.title);
var cId='ci'+i;
var car='';
if(imgs&&imgs.length){
car='<div class="popup-carousel" id="'+cId+'"><div class="carousel-imgs">';
for(var k=0;k<imgs.length;k++){
car+='<img src="'+imgs[k]+'" class="carousel-img'+(k===0?' active':'')+'" onerror="this.style.display=\'none\'">';
}
car+='</div>';
if(imgs.length>1){
car+='<button class="carousel-btn carousel-prev" onclick="navC(\''+cId+'\',-1)">&lsaquo;</button>';
car+='<button class="carousel-btn carousel-next" onclick="navC(\''+cId+'\',1)">&rsaquo;</button>';
car+='<div class="carousel-dots">';
for(var k=0;k<imgs.length;k++)car+='<span class="carousel-dot'+(k===0?' active':'')+'" onclick="goC(\''+cId+'\','+k+')"></span>';
car+='</div>';
}
car+='</div>';
}
var de=getDesc(p.title);
var html='<div class="popup-inner">'+car+'<div class="popup-title">'+FAI[p.type]+' '+esc(p.title)+'</div><div class="popup-day">Day '+p.day+' - '+p.date+'</div>';
if(p.desc)html+='<div class="popup-desc">'+esc(p.desc)+'</div>';
if(de)html+='<div class="popup-desc-cn">'+de+'</div>';
html+='<a class="popup-btn" href="https://www.google.com/maps/search/?api=1&query='+p.lat+','+p.lng+'" target="_blank" rel="noopener"><i class="fas fa-map-marker-alt"></i> Google Maps</a></div>';
m.bindPopup(html,{className:'custom-popup',offset:[0,-10],maxWidth:300});
detailMarkers.push(m);
});
return g;
}

function makeClusterIcon(c){
return L.divIcon({className:'',html:'<div style="display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.93);border-radius:18px;padding:4px 12px 4px 8px;border:1.5px solid #bbb;box-shadow:0 1px 5px rgba(0,0,0,.08);font-size:12px;font-weight:500;color:#000;white-space:nowrap"><i class="fas fa-'+c.icon+'" style="color:'+c.color+';font-size:13px"></i> '+c.name+'</div>',iconSize:[0,0],iconAnchor:[0,0]});
}

function buildCluster(){
var g=L.layerGroup();
CLUSTERS.forEach(function(c){
var m=L.marker([c.lat,c.lng],{icon:makeClusterIcon(c)}).addTo(g);
m.on('click',function(){if(c.zoom)map.fitBounds([[c.zoom[0],c.zoom[2]],[c.zoom[1],c.zoom[3]]],{padding:[60,60]});setTimeout(function(){syncZ()},600)});
clusterMarkers.push(m)
});
return g;
}

detailLayer=buildDetail();
clusterLayer=buildCluster();

function syncZ(){
var z=map.getZoom();
if(z<CLUSTER_ZOOM){
if(map.hasLayer(detailLayer))map.removeLayer(detailLayer);
if(!map.hasLayer(clusterLayer))map.addLayer(clusterLayer);
}else{
if(map.hasLayer(clusterLayer))map.removeLayer(clusterLayer);
if(!map.hasLayer(detailLayer))map.addLayer(detailLayer);
}
}
map.on('zoomend',syncZ);
syncZ();

// ─── CRUISE ROUTE
L.polyline(CRUISE,{color:'#7b1fa2',weight:3,opacity:.45,dashArray:'8,10'}).addTo(map);

// ─── OSRM ROUTING
fullRouteLine=null;
dayRouteLines={};

async function fetchR(coords){
if(coords.length<2)return null;
var s=coords.map(function(c){return c[1]+','+c[0]}).join(';');
try{var r=await fetch(OSRM+s+'?geometries=geojson&overview=full&alternatives=false&steps=false');var d=await r.json();if(d.code!=='Ok'||!d.routes||!d.routes[0])return null;return d.routes[0].geometry.coordinates.map(function(c){return[c[1],c[0]]})}catch(e){return null}
}

async function buildRoutes(){
var fc=allPoints.map(function(p){return[p.lat,p.lng]});
var fg=await fetchR(fc);
if(fg){fullRouteLine=L.polyline(fg,{color:'#222',weight:4.5,opacity:.5,dashArray:'10,11'}).addTo(map)}
else{fullRouteLine=L.polyline(fc,{color:'#222',weight:3.5,opacity:.4,dashArray:'9,9'}).addTo(map)}
for(var di=0;di<DAYS.length;di++){
var d=DAYS[di];
var pts=d.events.map(function(e){return[e.lat,e.lng]});
if(pts.length<2)continue;
var g=await fetchR(pts);
if(g){dayRouteLines[d.day]=L.polyline(g,{color:'#222',weight:3.5,opacity:.35,dashArray:'7,8'})}
}
if(fullRouteLine)map.fitBounds(fullRouteLine.getBounds(),{padding:[40,40]});
}

// ─── SIDEBAR
function renderSidebar(){
var html='';
for(var di=0;di<DAYS.length;di++){
var d=DAYS[di];
html+='<div class="day-card" data-day="'+d.day+'" onclick="focusDay('+d.day+')">';
html+='<div class="day-header"><span class="day-num">Day '+d.day+'</span><span class="day-date">'+d.date+'</span></div>';
html+='<div class="day-title">'+esc(d.title)+'</div>';
if(d.weather)html+='<div class="day-weather" style="color:'+(d.wcolor||'#888')+'">'+(d.wicon||'')+' '+esc(d.weather)+'</div>';
html+='<ul>';
for(var ei=0;ei<d.events.length;ei++){
html+='<li><span class="li-icon">'+FAI[d.events[ei].type]+'</span>'+esc(d.events[ei].title)+'</li>';
}
html+='</ul>';
if(d.drive)html+='<div class="day-drive"><i class="fas fa-car"></i> '+esc(d.drive)+'</div>';
html+='</div>';
}
document.getElementById('day-list').innerHTML=html;
}

// ─── INTERACTION
window.focusDay=function(day){
document.querySelectorAll('.day-card').forEach(function(c){c.classList.remove('active')});
var card=document.querySelector('.day-card[data-day="'+day+'"]');
if(card){card.classList.add('active');card.scrollIntoView({behavior:'smooth',block:'nearest'})}
var pts=allPoints.filter(function(p){return p.day===day});
if(!pts.length)return;
var b=L.latLngBounds(pts.map(function(p){return[p.lat,p.lng]}));
map.fitBounds(b,{padding:[80,80],maxZoom:13});
Object.values(dayRouteLines).forEach(function(l){map.removeLayer(l)});
if(dayRouteLines[day])dayRouteLines[day].addTo(map);
if(fullRouteLine)fullRouteLine.setStyle({opacity:.08,weight:1.5});
detailMarkers.forEach(function(m,i){m.setIcon(makePOIMarker(allPoints[i],allPoints[i].day===day,i))});
};

window.resetMap=function(){
document.querySelectorAll('.day-card').forEach(function(c){c.classList.remove('active')});
Object.values(dayRouteLines).forEach(function(l){map.removeLayer(l)});
if(fullRouteLine){map.fitBounds(fullRouteLine.getBounds(),{padding:[40,40]});fullRouteLine.setStyle({opacity:.5,weight:4.5,dashArray:'10,11'})}
detailMarkers.forEach(function(m,i){m.setIcon(makePOIMarker(allPoints[i],false,i))});
};
map.on('click',resetMap);

document.addEventListener('keydown',function(e){
var a=document.querySelector('.day-card.active');var c=a?parseInt(a.dataset.day):1;
if(e.key==='ArrowRight'||e.key==='ArrowDown'){var n=Math.min(c+1,DAYS.length);if(n!==c)focusDay(n)}
else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){var p=Math.max(c-1,1);if(p!==c)focusDay(p)}
});

var tx=0;
document.addEventListener('touchstart',function(e){tx=e.changedTouches[0].screenX});
document.addEventListener('touchend',function(e){
var d=e.changedTouches[0].screenX-tx;if(Math.abs(d)<60)return;
var a=document.querySelector('.day-card.active');var c=a?parseInt(a.dataset.day):1;
if(d<0){var n=Math.min(c+1,DAYS.length);if(n!==c)focusDay(n)}else{var p=Math.max(c-1,1);if(p!==c)focusDay(p)}
});

window.navC=function(id,dir){
var w=document.getElementById(id);if(!w)return;
var imgs=w.querySelectorAll('.carousel-img'),dots=w.querySelectorAll('.carousel-dot');
var cur=-1;for(var i=0;i<imgs.length;i++)if(imgs[i].classList.contains('active')){cur=i;break}
if(cur<0)return;
imgs[cur].classList.remove('active');if(dots[cur])dots[cur].classList.remove('active');
cur=(cur+dir+imgs.length)%imgs.length;
imgs[cur].classList.add('active');if(dots[cur])dots[cur].classList.add('active');
};

window.goC=function(id,idx){
var w=document.getElementById(id);if(!w)return;
var imgs=w.querySelectorAll('.carousel-img'),dots=w.querySelectorAll('.carousel-dot');
imgs.forEach(function(i){i.classList.remove('active')});dots.forEach(function(d){d.classList.remove('active')});
if(imgs[idx])imgs[idx].classList.add('active');if(dots[idx])dots[idx].classList.add('active');
};

// ─── INIT
renderSidebar();
buildRoutes();
</script>
